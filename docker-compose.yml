services:
  postgres:
    image: postgres:17
    container_name: transcendence_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: srcs/backend/Dockerfile
    container_name: transcendence_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Europe/Brussels
      DATABASE_URL: ${DATABASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      FRONTED_URL: ${FRONTEND_URL}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/srcs/backend/node_modules
    command: sh -c "npx prisma db push && npx prisma generate && npm run start:dev"
    
  frontend:
    build:
      context: .
      dockerfile: srcs/frontend/Dockerfile
    expose:
      - "5173"
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    build: ./nginx
    container_name: transcendence_nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
